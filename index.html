<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<title>Votre reçu</title>
<!--
  LE REÇU ÉLECTRONIQUE — la page que le client ouvre en scannant le QR du
  ticket (Quickzy OS, migration 053, miroir-cloud/016).

  Une page statique, sans construction ni dépendance : elle s'héberge telle
  quelle sur n'importe quelle origine HTTPS (Vercel, Cloudflare Pages…). Le
  secret de la vente est dans le FRAGMENT (#…) : le navigateur ne l'envoie
  jamais au serveur qui sert la page, il n'est dans aucun journal d'accès. La
  page le passe à qos_recu_lire avec la clé PUBLIQUE du projet — la même que
  celle que l'application livre déjà (admin-server/src/config.ts).

  ?demo montre un reçu d'exemple, sans appeler le cloud.
-->
<style>
  :root {
    --fond: #f6f5f1; --carte: #ffffff; --texte: #1d1d1b; --doux: #6b6a65; --pale: #9a9892;
    --filet: rgba(0,0,0,.09); --vert: #2f6b12; --vert-fond: #eaf3de; --ambre: #7a4a08; --ambre-fond: #faeeda;
    --accent: #1f6f50;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #161614; --carte: #22221f; --texte: #f1efe8; --doux: #b4b2a9; --pale: #888780;
      --filet: rgba(255,255,255,.1); --vert: #c0dd97; --vert-fond: #27500a; --ambre: #fac775; --ambre-fond: #633806;
      --accent: #5dcaa5; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fond); color: var(--texte);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
  main { max-width: 440px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
  .tete { text-align: center; padding: 8px 0 20px; }
  .mag { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .coord { font-size: 13px; color: var(--doux); margin: 4px 0 0; }
  .meta { font-size: 13px; color: var(--pale); margin: 10px 0 0; }
  .total { text-align: center; padding: 4px 0 20px; }
  .total .lib { font-size: 13px; color: var(--doux); }
  .total .mt { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  .total .mt small { font-size: 16px; font-weight: 500; margin-left: 4px; color: var(--doux); }
  .pastille { display: inline-block; margin-top: 8px; font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--vert-fond); color: var(--vert); }
  .pastille.ambre { background: var(--ambre-fond); color: var(--ambre); }
  .carte { background: var(--carte); border: 1px solid var(--filet); border-radius: 14px; padding: 4px 16px; }
  .ligne { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--filet); }
  .ligne:last-child { border-bottom: 0; }
  .ligne .nom { min-width: 0; overflow-wrap: anywhere; }
  .ligne .det { display: block; font-size: 13px; color: var(--pale); }
  .ligne .mt { white-space: nowrap; }
  .regl { padding: 12px 4px 0; }
  .regl .ligne { border: 0; padding: 4px 0; font-size: 15px; }
  .regl .ligne span:first-child { color: var(--doux); }
  .regl .fort span { color: var(--texte) !important; font-weight: 600; }
  .actions { margin-top: 20px; display: grid; gap: 10px; }
  button { font: inherit; font-size: 15px; width: 100%; min-height: 46px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--filet); background: var(--carte); color: var(--texte); }
  button.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.principal { color: #04342c; } }
  .pied { text-align: center; font-size: 13px; color: var(--pale); margin-top: 22px; }
  .pied b { display: block; color: var(--doux); font-weight: 500; margin-bottom: 4px; }
  .etat { text-align: center; padding: 56px 8px; }
  .etat h1 { font-size: 20px; font-weight: 600; margin: 14px 0 6px; }
  .etat p { color: var(--doux); margin: 0 auto; max-width: 30ch; }
  .rond { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: var(--ambre-fond); color: var(--ambre); font-size: 26px; }
  .sig { text-align: center; font-size: 11px; letter-spacing: .18em; color: var(--pale); margin-top: 26px; text-transform: uppercase; }
  .cache { display: none; }
  @media print {
    body { background: #fff; color: #000; }
    .actions, .sig { display: none; }
    .carte { border-color: #ccc; }
  }
</style>
</head>
<body>
<main id="page" aria-live="polite">
  <div class="etat"><p>Chargement de votre reçu…</p></div>
</main>
<script>
"use strict";
// Le projet du miroir Quickzy OS : son adresse et sa clé PUBLIQUE (faite pour
// être dans une page ; elle n'ouvre que les fonctions accordées à « anon »).
const PROJET = "https://dwciqxhpdgheuyaapocp.supabase.co";
const CLE_PUBLIQUE = "sb_publishable_AiukcTPr_PbQdVKqoSmZAQ_TC5iUYr2";

const page = document.getElementById("page");
const echapper = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// L'ARGENT RESTE EN TEXTE : « 1260.00 » devient « 1 260,00 » sans passer par
// un flottant (même règle que la caisse).
function da(v) {
  const s = String(v ?? "0").trim();
  const neg = s.startsWith("-");
  const [e, d = ""] = s.replace(/^[-+]/, "").split(".");
  const entier = (e || "0").replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return `${neg ? "−" : ""}${entier},${(d + "00").slice(0, 2)}`;
}
const zero = (v) => !v || /^[-+]?0*(\.0*)?$/.test(String(v));
function qte(v) {
  const [e, d = ""] = String(v).split(".");
  const f = d.replace(/0+$/, "");
  return f ? `${e},${f}` : e;
}
const MODES = { especes: "Espèces", carte: "Carte", cheque: "Chèque", avoir: "Avoir", credit: "À crédit", autre: "Autre" };

function quand(iso) {
  const t = new Date(iso);
  if (isNaN(t)) return "";
  return t.toLocaleString("fr-FR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function etat(icone, titre, texte, bouton) {
  page.innerHTML = `<div class="etat"><div class="rond" aria-hidden="true">${icone}</div><h1>${echapper(titre)}</h1><p>${echapper(texte)}</p>
    ${bouton ? `<div class="actions" style="max-width:280px;margin:22px auto 0"><button class="principal" id="reessayer">${echapper(bouton)}</button></div>` : ""}</div>
    <div class="sig">Quickzy OS</div>`;
  const b = document.getElementById("reessayer");
  if (b) b.onclick = () => { page.innerHTML = '<div class="etat"><p>Recherche de votre reçu…</p></div>'; charger(); };
}

function montrer(r) {
  const m = r.magasin || {};
  document.title = `Reçu ${r.ticket} · ${m.nom}`;
  const aPayer = zero(r.arrondi) ? r.total : null;
  const lignes = (r.lignes || []).map((l) => {
    const kg = l.unite === "kg";
    const unSeul = !kg && Number(l.qte) === 1;
    const det = kg ? `${qte(l.qte)} kg × ${da(l.prix)} le kg` : unSeul ? "" : `${qte(l.qte)} × ${da(l.prix)}`;
    return `<div class="ligne"><span class="nom">${echapper(l.nom)}${det ? `<span class="det">${det}</span>` : ""}</span><span class="mt">${da(l.montant)}</span></div>`;
  }).join("");

  const regl = [];
  if (!zero(r.arrondi)) {
    regl.push(["Total des articles", da(r.total)]);
    regl.push(["Arrondi espèces", (String(r.arrondi).startsWith("-") ? "" : "+") + da(r.arrondi)]);
  }
  const reglements = (r.reglements && r.reglements.length) ? r.reglements : null;
  if (reglements) for (const x of reglements) regl.push([MODES[x.mode] || x.mode, da(x.montant)]);
  else if (r.mode === "credit") regl.push(["À crédit", da(r.total)]);
  else regl.push([r.mode === "especes" ? "Espèces reçues" : (MODES[r.mode] || "Payé"), da(r.paye)]);
  if (!zero(r.rendu)) regl.push(["Rendu", da(r.rendu), true]);
  if (r.retour && !zero(r.retour)) regl.push(["Rendu au client depuis (retour)", da(r.retour)]);

  // Le total payé, arrondi compris : ce que le client a sorti de sa poche.
  const paye = aPayer ?? sommeTexte(r.total, r.arrondi);
  const credit = r.mode === "credit";
  const pastille = credit ? '<span class="pastille ambre">Vente à crédit</span>'
    : `<span class="pastille">✓ Payé${r.mode === "especes" && !reglements ? " en espèces" : r.mode === "carte" && !reglements ? " par carte" : ""}</span>`;

  page.innerHTML = `
    <header class="tete">
      <p class="mag">${echapper(m.nom)}</p>
      ${m.adresse || m.telephone ? `<p class="coord">${[m.adresse && echapper(m.adresse), m.telephone && `Tél. ${echapper(m.telephone)}`].filter(Boolean).join("<br>")}</p>` : ""}
      <p class="meta">Ticket ${echapper(r.ticket)} · ${echapper(quand(r.le))}</p>
    </header>
    <section class="total">
      <div class="lib">${credit ? "Total" : "Total payé"}</div>
      <div class="mt">${da(paye)}<small>DA</small></div>
      ${pastille}
    </section>
    <section class="carte" aria-label="Articles">${lignes}</section>
    <section class="regl">${regl.map(([a, b, f]) => `<div class="ligne${f ? " fort" : ""}"><span>${echapper(a)}</span><span>${b}</span></div>`).join("")}</section>
    <div class="actions">
      <button class="principal" id="pdf">Enregistrer en PDF</button>
    </div>
    <div class="pied">${m.pied ? `<b>${echapper(m.pied)}</b>` : ""}Gardez ce reçu : il vaut ticket pour un échange ou un retour.</div>
    <div class="sig">Quickzy OS · Tout le magasin, un seul système</div>`;
  // L'impression du navigateur propose « Enregistrer au format PDF » partout.
  document.getElementById("pdf").onclick = () => window.print();
}

/** total + arrondi signé, en centimes entiers : jamais de flottant. */
function sommeTexte(a, b) {
  const c = (v) => {
    const s = String(v ?? "0").trim(); const neg = s.startsWith("-");
    const [e, d = ""] = s.replace(/^[-+]/, "").split(".");
    const n = BigInt(e || "0") * 100n + BigInt((d + "00").slice(0, 2));
    return neg ? -n : n;
  };
  const t = c(a) + c(b); const neg = t < 0n; const x = neg ? -t : t;
  return `${neg ? "-" : ""}${x / 100n}.${String(x % 100n).padStart(2, "0")}`;
}

const DEMO = {
  etat: "ok",
  magasin: { nom: "Supérette El Baraka", adresse: "12 rue Didouche Mourad, Alger", telephone: "0555 12 34 56", pied: "Merci de votre visite" },
  ticket: "C1-000482", caisse: "C1", le: "2026-11-07T14:32:00+01:00",
  total: "1450.00", arrondi: null, paye: "2000.00", rendu: "550.00", mode: "especes", reglements: null, retour: null,
  lignes: [
    { nom: "Lait entier 1L", qte: "1.000", prix: "110.00", montant: "110.00", unite: "piece" },
    { nom: "Café moulu 250g", qte: "3.000", prix: "420.00", montant: "1260.00", unite: "piece" },
    { nom: "Tomates", qte: "0.500", prix: "160.00", montant: "80.00", unite: "kg" },
  ],
};

let essais = 0;
async function charger() {
  if (new URLSearchParams(location.search).has("demo")) return montrer(DEMO);
  const jeton = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  if (!/^[A-Za-z0-9_-]{20,64}$/.test(jeton)) {
    return etat("?", "Reçu introuvable", "Ce lien ne mène à aucun reçu. Scannez à nouveau le QR imprimé sur votre ticket.");
  }
  let r;
  try {
    const res = await fetch(`${PROJET}/rest/v1/rpc/qos_recu_lire`, {
      method: "POST",
      headers: { "content-type": "application/json", apikey: CLE_PUBLIQUE },
      body: JSON.stringify({ p_jeton: jeton }),
      referrerPolicy: "no-referrer",
    });
    if (!res.ok) throw new Error(String(res.status));
    r = await res.json();
  } catch {
    return etat("!", "Pas de connexion", "Votre reçu n’a pas pu être chargé. Vérifiez votre connexion internet.", "Réessayer");
  }
  if (r.etat === "ok") return montrer(r);
  if (r.etat === "en_route") {
    // La caisse envoie ses ventes dès qu'internet le permet : quelques
    // minutes, parfois plus si le magasin est hors ligne. On réessaie seul.
    essais++;
    if (essais < 30) setTimeout(charger, 20000);
    return etat("⏳", "Votre reçu arrive", "Le magasin est en train de l’envoyer. Cette page se met à jour toute seule ; vous pouvez aussi revenir plus tard avec le même QR.", "Réessayer maintenant");
  }
  return etat("?", "Reçu introuvable", "Ce lien ne mène à aucun reçu. Scannez à nouveau le QR imprimé sur votre ticket.");
}
window.addEventListener("hashchange", () => { essais = 0; charger(); });
charger();
</script>
</body>
</html>
